# SPDX-License-Identifier: LGPL-2.1-or-later
# Workshop for FreeCAD's tests on the newest FreeCAD conda-forge has and the
# newest 1.1 and 1.0: each add-on alone (its API and commands, no agent),
# then with Agent Link beside it (the tools an agent calls).
name: Workshop tests

on:
  push:
    branches: [main, 'test-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        series: ['newest', '1.1', '1.0']
    name: freecad-${{ matrix.series }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: jamesK1000011/AddonKit-FreeCAD
          path: addonkit-lib
      - uses: actions/checkout@v5
        with:
          repository: jamesK1000011/AgentLink-FreeCAD
          path: agentlink-addon
      - uses: actions/checkout@v5
        # Agent Link for OrcaSlicer: the slicers' command lines Make slices through.
        with:
          repository: jamesK1000011/AgentLink-OrcaSlicer
          path: orcalink-addon
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc-${{ matrix.series }}
          create-args: >-
            -c conda-forge
            ${{ matrix.series == 'newest' && 'freecad' || format('freecad={0}', matrix.series) }}
            python=3.11
            numpy
            calculix
            gmsh
          cache-environment: true
      - name: FreeCAD imports
        run: |
          echo "FREECAD_LIB=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
          echo "ORCALINK_DIR=$GITHUB_WORKSPACE/orcalink-addon" >> "$GITHUB_ENV"
          python -c "import sys; sys.path.append('$CONDA_PREFIX/lib'); import FreeCAD, Part; print('FreeCAD', FreeCAD.Version()[:3])"
      - name: PrusaSlicer and a virtual screen
        # The apt mirror sometimes hangs: the slicing tests skip without it.
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends prusa-slicer xvfb libopengl0 libegl1 libgl1 > /dev/null
      - name: Each add-on alone (no Agent Link)
        # Not exit: a login shell's exit runs ~/.bash_logout, whose
        # clear_console fails on the runner and turns a pass into 1.
        run: |
          code=0
          export PYTHONPATH="$GITHUB_WORKSPACE/addonkit-lib:$GITHUB_WORKSPACE/Common:$GITHUB_WORKSPACE/Parts:$GITHUB_WORKSPACE/Make"
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/alone.log" 2>&1 || code=$?
          for d in Common Parts Make; do python -X faulthandler -m unittest discover -s $d/tests -v >> "$RUNNER_TEMP/alone.log" 2>&1 || code=$?; done
          tail -n 200 "$RUNNER_TEMP/alone.log"
          echo "exit code: $code"
          test "$code" -eq 0
      - name: With Agent Link beside it
        run: |
          code=0
          export PYTHONPATH="$GITHUB_WORKSPACE/agentlink-addon:$GITHUB_WORKSPACE/addonkit-lib:$GITHUB_WORKSPACE/Common:$GITHUB_WORKSPACE/Parts:$GITHUB_WORKSPACE/Make" AGENTLINK_DIR="$GITHUB_WORKSPACE/agentlink-addon"
          for d in Common Parts Make; do python -X faulthandler -m unittest discover -s $d/tests -v >> "$RUNNER_TEMP/with.log" 2>&1 || code=$?; done
          tail -n 200 "$RUNNER_TEMP/with.log"
          echo "exit code: $code"
          test "$code" -eq 0
