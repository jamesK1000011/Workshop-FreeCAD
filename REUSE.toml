# SPDX-License-Identifier: LGPL-2.1-or-later
version = 1

[[annotations]]
path = ["workshop_parts/icons/*.svg", "workshop_make/icons/*.svg", "workshop_electronics/icons/*.svg", "workshop_documents/icons/*.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Workshop for FreeCAD contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
# Hand-drawn in FreeCAD's icon style (Tango palette). Compositions follow the
# Tabler Icons (MIT) and Pictogrammers MDI (Apache-2.0) glyphs named in each
# icons/CREDITS.md; no source paths were copied. Licence texts: LICENSES/.

[[annotations]]
path = ["workshop_parts/data/**", "workshop_make/data/**", "workshop_electronics/data/**", "workshop_documents/data/**", "workshop_fasteners/data/**"]
SPDX-FileCopyrightText = "Workshop for FreeCAD contributors"
SPDX-License-Identifier = "CC-BY-4.0"
# Data files and their schemas (LICENSE-DATA). Each entry names its source and date.

[[annotations]]
path = ["FILES", "package.xml", "CHANGELOG.md", ".gitignore", ".github/**", "workshop_*/guides/*.md", "workshop_*/icons/CREDITS.md", "docs/**"]
SPDX-FileCopyrightText = "Workshop for FreeCAD contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = "safetynet/icons/*.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "SafetyNet contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
# Brought in from SafetyNet-FreeCAD (same licence). Hand-drawn in FreeCAD's
# icon style; see safetynet/icons/CREDITS.md and the texts in LICENSES/.

[[annotations]]
path = ["safetynet/guides/*.md", "safetynet/icons/CREDITS.md", "tests/safetynet/data/**"]
SPDX-FileCopyrightText = "SafetyNet contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = "workshop/lessons/*.lesson.json"
SPDX-FileCopyrightText = "Tutor contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
# Lessons for the Tutor (Tutor-FreeCAD, same licence), copied from its
# docs/examples/workshop/lessons/; the Tutor finds them in the lessons/
# folder beside workshop/agentlink_families.py.
